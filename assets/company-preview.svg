<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">NORTHLINE企業サイトのプレビュー</title>
  <desc id="desc">落ち着いたネイビーと生成り色を使った左右非対称の企業サイト</desc>
  <rect width="1000" height="650" fill="#f9f7f2"/>
  <rect width="1000" height="72" fill="#f9f7f2"/>
  <line x1="0" y1="72" x2="1000" y2="72" stroke="#0c2036" stroke-opacity=".2"/>
  <circle cx="58" cy="36" r="20" fill="#e35d3f"/>
  <text x="51" y="44" font-family="sans-serif" font-size="22" font-weight="bold" fill="white">N</text>
  <text x="90" y="42" font-family="sans-serif" font-size="22" font-weight="bold" fill="#0c2036">NORTHLINE</text>
  <text x="710" y="42" font-family="sans-serif" font-size="14" fill="#0c2036">事業内容　会社情報　相談窓口</text>
  <rect x="650" y="72" width="350" height="578" fill="#0c2036"/>
  <text x="64" y="145" font-family="sans-serif" font-size="15" font-weight="bold" letter-spacing="2" fill="#275d78">LOCAL KNOWLEDGE / BUSINESS DESIGN</text>
  <text x="60" y="272" font-family="serif" font-size="65" fill="#0c2036">地域の知恵を、</text>
  <text x="60" y="365" font-family="serif" font-size="65" fill="#e35d3f">前へ進む力に。</text>
  <text x="64" y="430" font-family="sans-serif" font-size="18" fill="#0c2036">現場にある声と数字を読み解き、</text>
  <text x="64" y="458" font-family="sans-serif" font-size="18" fill="#0c2036">事業の次の一手を設計する。</text>
  <rect x="64" y="505" width="205" height="54" fill="#0c2036"/>
  <rect x="70" y="511" width="205" height="54" fill="#e35d3f"/>
  <rect x="64" y="505" width="205" height="54" fill="#0c2036"/>
  <text x="94" y="539" font-family="sans-serif" font-size="17" font-weight="bold" fill="white">支援領域を見る →</text>
  <text x="700" y="165" font-family="sans-serif" font-size="13" letter-spacing="2" fill="#99b8c6">AT A GLANCE</text>
  <line x1="700" y1="205" x2="944" y2="205" stroke="white" stroke-opacity=".25"/>
  <text x="700" y="235" font-family="sans-serif" font-size="12" fill="#99b8c6">FOCUS</text><text x="700" y="272" font-family="serif" font-size="25" fill="white">地域事業の前進</text>
  <line x1="700" y1="310" x2="944" y2="310" stroke="white" stroke-opacity=".25"/>
  <text x="700" y="340" font-family="sans-serif" font-size="12" fill="#99b8c6">APPROACH</text><text x="700" y="377" font-family="serif" font-size="25" fill="white">調査・企画・発信</text>
  <line x1="700" y1="415" x2="944" y2="415" stroke="white" stroke-opacity=".25"/>
  <text x="700" y="445" font-family="sans-serif" font-size="12" fill="#99b8c6">BASE</text><text x="700" y="482" font-family="serif" font-size="25" fill="white">Sapporo</text>
</svg>
