<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="650" viewBox="0 0 1000 650" role="img" aria-labelledby="title desc">
  <title id="title">発信ラボのイベントLPプレビュー</title>
  <desc id="desc">日付を大きく見せたオレンジ、黄緑、紫のポスター風イベント案内</desc>
  <rect width="1000" height="650" fill="#fff8e8"/>
  <rect width="1000" height="70" fill="#d9f75f"/>
  <line x1="0" y1="70" x2="1000" y2="70" stroke="#2b153d" stroke-width="4"/>
  <text x="45" y="45" font-family="sans-serif" font-size="24" font-weight="bold" fill="#2b153d">発信ラボ</text>
  <text x="735" y="43" font-family="sans-serif" font-size="14" font-weight="bold" fill="#2b153d">体験内容　当日の流れ　開催概要</text>
  <rect x="0" y="70" width="110" height="580" fill="#ff6547"/>
  <line x1="110" y1="70" x2="110" y2="650" stroke="#2b153d" stroke-width="4"/>
  <g transform="translate(68 565) rotate(-90)"><text font-family="sans-serif" font-size="46" font-weight="bold" letter-spacing="3" fill="#2b153d">10.24 SAT</text></g>
  <text x="165" y="145" font-family="sans-serif" font-size="15" font-weight="bold" letter-spacing="2" fill="#2b153d">発信を始めたい人のための体験ワークショップ</text>
  <text x="155" y="285" font-family="sans-serif" font-size="92" font-weight="900" fill="#2b153d">魅力を、</text>
  <text x="155" y="395" font-family="sans-serif" font-size="92" font-weight="900" fill="#ff6547">言葉に。</text>
  <circle cx="698" cy="158" r="60" fill="#d9f75f" stroke="#2b153d" stroke-width="4"/>
  <text x="667" y="166" font-family="sans-serif" font-size="20" font-weight="bold" fill="#2b153d">90 MIN</text>
  <rect x="760" y="70" width="240" height="580" fill="#2b153d"/>
  <text x="795" y="165" font-family="sans-serif" font-size="12" letter-spacing="2" fill="#d9f75f">WORKSHOP TICKET</text>
  <text x="790" y="255" font-family="sans-serif" font-size="64" font-weight="bold" fill="white">10.24</text>
  <text x="795" y="295" font-family="sans-serif" font-size="19" fill="white">SAT 14:00—15:30</text>
  <line x1="795" y1="345" x2="955" y2="345" stroke="white" stroke-dasharray="6 6" opacity=".5"/>
  <text x="795" y="382" font-family="sans-serif" font-size="12" fill="#cbbfd0">PLACE</text><text x="795" y="412" font-family="sans-serif" font-size="18" fill="white">オンライン</text>
  <line x1="795" y1="447" x2="955" y2="447" stroke="white" stroke-dasharray="6 6" opacity=".5"/>
  <text x="795" y="484" font-family="sans-serif" font-size="12" fill="#cbbfd0">FEE</text><text x="795" y="514" font-family="sans-serif" font-size="18" fill="white">1,000円</text>
  <rect x="160" y="500" width="208" height="56" fill="#d9f75f" stroke="#2b153d" stroke-width="4"/>
  <text x="191" y="536" font-family="sans-serif" font-size="18" font-weight="bold" fill="#2b153d">体験内容を見る ↓</text>
