name: Validate site

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Check HTML, links, metadata, and sitemap
        run: python tests/check_site.py
      - name: Check contact context handling
        run: node --test tests/contact-context.test.cjs
